# roboshop-user/.github/workflows/user.yml
name: frontend
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  ci:
    uses: BunnyDevOpsPractice/ArgoCD_Project/.github/workflows/ci.yml@main
    with:
      language: node
      component: frontend
      deploy: true          # so it bumps gitops; faithful ci.yml defaults this to false
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
